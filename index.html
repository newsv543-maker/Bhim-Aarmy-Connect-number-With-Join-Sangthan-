<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bhima Army Connect</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .box {
      max-width: 600px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      text-align: center;
    }

    .info {
      background: #eee;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Bhima Army Connect</h1>
  </div>

  <div class="box">

    <h2>ग्रुप के बारे में</h2>

    <p>
      यह ग्रुप भाई चंद्रशेखर रावण के समर्थन से जुड़ी
      जानकारी और लोगों की बात एक जगह साझा करने के लिए बनाया गया है।
    </p>

    <div class="info">
      <strong>उद्देश्य:</strong>
      <p>
        लोगों की समस्याओं और सुझावों को व्यवस्थित रूप से
        साझा करने के लिए एक डिजिटल माध्यम उपलब्ध कराना।
      </p>
    </div>

  </div>

  <div class="footer">
    Bhima Army Connect
  </div>

</body>
</html>
